plugin: google.cloud.gcp_compute
projects:
  - project-0d94d8bf-842c-4e18-818 # Replace with your actual GCP Project ID
auth_kind: application
keyed_groups:
  - prefix: gcp
    key: labels
hostnames:
  - name
compose:
  ansible_host: networkInterfaces[0].accessConfigs[0].natIP # Uses Public IP. Change to networkInterfaces[0].networkIP for Private IP.
